name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby: "3.3"
          - os: ubuntu-latest
            ruby: "4.0"
          - os: macos-latest
            ruby: "4.0"
          - os: ubuntu-latest
            ruby: "4.0"
            breadkit_source: published
    defaults:
      run:
        working-directory: breadkit-rspec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.breadkit_source != 'published'
        with:
          repository: breadkit/breadkit
          ref: main
          path: breadkit
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: breadkit-rspec
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: breadkit-rspec
      - run: bundle exec rake
        env:
          BREADKIT_SOURCE: ${{ matrix.breadkit_source }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"
          bundler: default
      - run: gem build --strict breadkit-rspec.gemspec
